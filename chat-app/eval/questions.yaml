# WS7 acceptance question set (MVP-PLAN §4.3-4.8, §7, WS7).
#
# Exactly 25 questions: 8 probe + 3 user + 4 operational + 4 traps +
# 3 document + 3 wide-scope.
#
# Each question is a deterministic contract:
#   mode             desk | document
#   document_id      required in document mode; a real note id on disk
#   selection        optional quoted passage for document chat
#   ticker/period/year  optional focus (ignored by document mode, echoed by desk)
#   must_include     substrings, or regexes when the pattern uses regex syntax
#   must_not_claim   regexes/substrings that must not appear in answer+claims
#   expect_state     optional missing[] state (not_yet_published|not_disclosed|
#                    not_captured|unsupported|not_in_document)
#   expect_label     optional claim label that must appear with a citation
#   expect_citations citation obligations:
#                      required: every non-hypothesis claim and the envelope cite
#                      document: at least one analysis_note with
#                                document+section+line+quote
#                      tickers:  every listed ticker appears in a citation
#   expect_coverage  desk-only: the envelope carries a coverage block naming the
#                    compared tickers (required for every wide-scope question)
#   expect_refusal   a refused/error run is acceptable for this question
#
# Probe/user/operational/trap values are grounded in the current artifacts:
# idx_data/analysis/facts, idx_data/operational (ITMG Q2 oracle + canonical JSON),
# and notes_rag.duckdb. Document questions pin real notes under analysis/.
# Wide-scope questions exercise compare_supported's bounded matrix, not a screen.

# ---------------------------------------------------------------------------
# Probe (8): substrate correctness and the plan's seed questions
# ---------------------------------------------------------------------------

- id: probe_itmg_q2_production
  category: probe
  mode: desk
  question: "How much coal did ITMG produce in Q2 2026, and how does that compare with the prior quarter? Cite the source page."
  ticker: ITMG
  period: Q2
  year: 2026
  must_include: ["5.3", '13\s*(%|percent)|15(?:\.2)?\s*(%|percent)|0[.,]?7|higher|increase|rose']
  must_not_claim: ["does not exist", "no data available"]
  expect_state: null
  expect_label: fact
  expect_citations:
    required: true
  expect_refusal: false
  notes: "ITMG Q2 2026: 5.3 Mt, +13% QoQ, page 1 of itmg_2026-08-10_news_release."

- id: probe_itmg_q2_cogs_driver
  category: probe
  mode: desk
  question: "ITMG's 6M 2026 cost of revenue rose 7% year on year. Derive the Q2 2026 quarter COGS from the cumulative filings and explain what management says drove the increase."
  ticker: ITMG
  period: Q2
  year: 2026
  must_include: ["379", 'strip(?:ping)?[- ]ratio']
  must_not_claim: ["does not exist", "no data available"]
  expect_state: null
  expect_label: management_stated
  expect_citations:
    required: true
  expect_refusal: false
  notes: "6M COGS 744,014 minus Q1 364,824 = 379,190 USD thousand (period_derive). Management quote: higher strip ratio and higher fuel costs, page 1."

