# ---------------------------------------------------------------------------
# Document (3): pinned notes, analysis_note provenance, note silence
# ---------------------------------------------------------------------------

- id: doc_itmg_q2_cash_flow
  category: document
  mode: document
  document_id: itmg-q2-2026-analysis
  ticker: ITMG
  period: Q2
  year: 2026
  selection:
    section: "1. Executive Summary"
    line: 16
    quote: "We treat this as a timing artifact rather than operating deterioration."
  question: "The selected passage treats the cash-flow collapse as a timing artifact. Is that the analyst's inference or management's explanation, and what does the note say caused the collapse? Cite the section."
  must_include: ['timing artifact', 'refund', '169', 'management']
  must_not_claim: ['management (?:said|stated|attributes|explained).{0,100}timing artifact', "does not exist", "no data available"]
  expect_state: null
  expect_label: analysis_note
  expect_citations:
    required: true
    document: true
  expect_refusal: false
  notes: "ITMG Q2 2026 Analysis.md §1/§5.1: 'We treat this as a timing artifact rather than operating deterioration'; management's release instead points to the non-repeat of ~US$169m H1 2025 tax refunds. The passage is analyst inference and must be analysis_note, never management_stated."

- id: doc_ptba_q2_cost_argument
  category: document
  mode: document
  document_id: ptba-q2-2026-analysis
  ticker: PTBA
  period: Q2
  year: 2026
  question: "Summarise the PTBA Q2 2026 note's cost and margin argument and cite the section. Keep the note's interpretation separate from the filing's reported numbers."
  must_include: ['19\.28', '829', 'weak (?:H1 2025 )?base|price-led|cost']
  must_not_claim: ['management (?:said|stated|attributes).{0,100}(?:weak (?:H1 2025 )?base|price-led)', "does not exist", "no data available"]
  expect_state: null
  expect_label: analysis_note
  expect_citations:
    required: true
    document: true
  expect_refusal: false
  notes: "PTBA Q2 2026 Analysis.md §3.1: gross margin 19.28% (+829 bps) and the two-part argument: a weak H1 2025 base plus genuine 2026 price-led expansion. Both figures and the interpretation are note claims (analysis_note), not desk facts."

- id: doc_ptps_q2_hypotheses_silence
  category: document
  mode: document
  document_id: ptps-q2-2026-analysis
  ticker: PTPS
  period: Q2
  year: 2026
  question: "Which claims in the PTPS Q2 2026 note are hypotheses rather than facts, and does the note discuss strip ratio or mining costs? If the note is silent, say so explicitly."
  must_include: ['strip(?:ping)?[- ]ratio', 'not (?:cover|covered|discuss|discussed|mention)|does not (?:cover|discuss|mention)|silent|no mention|not_in_document', 'hypothes|may|could|likely|interpret|outlook']
  must_not_claim: ['strip(?:ping)?[- ]ratio[^.]{0,80}not[_ ]disclosed', 'not[_ ]disclosed[^.]{0,80}strip(?:ping)?[- ]ratio', "does not exist", "no data available", 'note (?:is|was) (?:missing|not available)']
  expect_state: not_in_document
  expect_label: hypothesis
  expect_citations:
    required: true
    document: true
  expect_refusal: false
  notes: "PTPS is a palm-oil producer; the note has no strip-ratio or mining-cost discussion, so the correct state is not_in_document, never not_disclosed or 'does not exist'. Its 2H CPO recovery/SEAL dividend language and the SJA mill outcome are hypotheses, not facts."

