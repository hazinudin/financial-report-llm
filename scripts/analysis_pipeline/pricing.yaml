# Token pricing for the analysis pipeline (USD per million tokens).
#
# These rates are ESTIMATES, not a billing record. The pi runner reports its
# own provider cost in `usage.cost_usd`; this table is used only where the
# provider does not return a cost (opencode_client stages such as extraction
# and red-flags) so every stage has a non-zero cost bucket.
#
# `estimated: true` is intentional: do not treat the derived total as an
# invoice. Update the rates when the provider price list changes.
estimated: true
currency: USD
unit: per_million_tokens

models:
  # Command Code Provider API (the current default). Rates mirror the catalog
  # rate pi records in `usage.cost_usd`; a 1,319-in/1-out probe cost $0.0003969.
  deepseek/deepseek-v4.1-flash:
    input_per_mtok: 0.30
    output_per_mtok: 1.20
  # Legacy OpenCode Go IDs (kept so old run traces and rollbacks still price).
  deepseek-v4.1-flash:
    input_per_mtok: 0.27
    output_per_mtok: 1.10
  deepseek-v4-flash:
    input_per_mtok: 0.27
    output_per_mtok: 1.10
  glm-5.3:
    input_per_mtok: 0.60
    output_per_mtok: 2.20
  glm-5.3-flash:
    input_per_mtok: 0.10
    output_per_mtok: 0.40
