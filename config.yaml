pipeline:
  maas:
    enabled: false
  ocr_api:
    api_host: localhost
    api_port: 11434
    model_name: glm-ocr

analysis:
  opencode:
    base_url: https://opencode.ai/zen/go/v1
    # API key read from OPENCODE_API_KEY in .env (do not commit the key)
    timeout_sec: 300
  models:
    # Extraction is lookup-style on preprocessed chunks; temperature 0.
    # Confirm exact IDs via: uv run scripts/analysis_pipeline/pipeline.py --list-models
    extract: deepseek-v4.1-flash
    redflags: deepseek-v4.1-flash
    # Canonical writer model (pi --model for Stage 4); analysis.write.pi.model
    # falls back to this when unset. The only calls where reasoning quality is
    # binding.
    write: glm-5.3
    # Research-plan model (pi --model for Stage 3b's planner); analysis.plan.pi.model
    # falls back to this when unset. Strong reasoning to derive period
    # arithmetic and spot drivers.
    research_plan: glm-5.3
    # Research synthesis: pi agent --model. Operator choice "for now";
    # rollback → glm-5.3-flash (see PI_RESEARCH_AGENT_PLAN.md §1 decision 4).
    research: deepseek-v4.1-flash
  # ── Writer (Stage 4) ────────────────────────────────────────────────
  # Headless pi agent; read-only tools (PI_WRITER_AGENT_PLAN.md §4.3/§4.5).
  write:
    pi:
      provider: opencode-go
      # model omitted → falls back to models.write (glm-5.3)
      thinking: "off"
      timeout_sec: 1800
      approve: true
      load_skills: false
      load_context_files: false
      # Persist the agent's session under ~/.pi/agent/sessions/ (browsable /
      # resumable via `pi --resume`). Session id is also in the run trace.
      save_session: true
      tools: [read, duckdb_query, notes_search, notes_fetch]  # [] → --no-tools
      max_db_queries: 6
      max_notes_search: 4
      max_notes_fetch: 4
  # ── Research planner (Stage 3b, step 1) ─────────────────────────────
  # Headless pi agent with the read-only idx-tools; no web tools (external
  # evidence stays with Stage 3b's search agent). See PI_PLANNER_AGENT_PLAN.md.
  plan:
    pi:
      provider: opencode-go
      # model omitted → falls back to models.research_plan (glm-5.3)
      thinking: "off"
      timeout_sec: 600
      approve: true
      load_skills: false
      load_context_files: false
      save_session: true
      tools: [read, duckdb_query, notes_search, notes_fetch]  # [] → --no-tools
      max_db_queries: 4
      max_notes_search: 3
      max_notes_fetch: 3
  max_tokens:
    # Seeded mode asks note chunks for details+context_notes only (~1-2K out).
    # deepseek-v4-flash is a REASONING model: reasoning tokens count against
    # max_tokens, so keep headroom even with reasoning_effort=low (empty
    # content with finish_reason=length was observed at 8192 on big chunks).
    extract: 16384
    redflags: 4096
  temperature:
    extract: 0.0
    redflags: 0.0
  # Extraction is copy/lookup — low reasoning effort is faster and avoids
  # burning the token budget on hidden reasoning. Honored by deepseek-v4.
  reasoning_effort:
    extract: low
  # Hard token cap per LLM call (§9 budget). Chunks exceeding this are split.
  call_token_cap: 32000
  # Max INPUT tokens fed to an extraction call (leaves headroom for the ~8K
  # YAML output + system/user prompt). Total call stays under call_token_cap.
  extraction_input_token_cap: 16000
  extraction_prompt_token_overhead: 1500
  # Notes-only chunks are small; 4 parallel workers keep the API busy without
  # tripping rate limits (opencode_client backs off on 429 anyway).
  extraction_workers: 4
  # XLSX cross-validation tolerance (deviation as a fraction of the XLSX value).
  xlsx_deviation_tolerance: 0.005
  # ── External Research (Stage 3b) ────────────────────────────────────
  research:
    enabled: true
    agent: pi                       # pi | deterministic_fallback
    # pi-agent research stage (PI_RESEARCH_AGENT_PLAN.md §4.7).
    pi:
      provider: opencode-go
      model: deepseek-v4.1-flash
      thinking: "off"
      timeout_sec: 900
      approve: true
      load_skills: false
      load_context_files: false
      # Persist the agent's session under ~/.pi/agent/sessions/ (browsable /
      # resumable via `pi --resume`). Session id is also in the run trace.
      save_session: true
      tools: [exa_search, fetch_content]
      max_search_calls: 16
      max_fetch_calls: 8
    max_questions: 12
    max_queries_per_question: 3
    brief_token_cap: 4000
    # Max chars of prior-quarter analysis markdown fed to the research-plan
    # LLM (keeps the planner prompt bounded across tickers with long histories).
    max_planner_analysis_chars: 12000
    sector_pack_max_age_days: 31
    triggers:
      margin_bps: 500
      expense_zero_or_double: true
      receivables_growth_pct: 50
      collections_ratio_floor: 0.80
      ocf_np_divergence: [0.8, 1.5]
      balance_sheet_move_pct: 30
    source_classification:
      government:
        domains:
          - esdm.go.id
          - bi.go.id
          - bps.go.id
          - setkab.go.id
          - kemenkeu.go.id
          - kemenperin.go.id
          - kemen-esdm.go.id
          - bappebti.go.id
          - dpr.go.id
      filing:
        domains:
          - idx.co.id
      news:
        domains:
          - reuters.com
          - bloomberg.com
          - cnbc.com
          - cnbcindonesia.com
          - bisnis.com
          - kontan.co.id
          - kompas.com
          - tribunnews.com
          - detik.com
          - antaranews.com
          - tempo.co
          - liputan6.com
          - idxchannel.com
          - rollingstock.id
          - wartaekonomi.co.id
          - swa.co.id
      research:
        domains:
          - stockbit.com
          - samuel.co.id
          - miraeasset.co.id
          - indopremier.com
